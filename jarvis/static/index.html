<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ILARIA</title>
  <link rel="icon" href="/favicon.svg" />
  <style>
    :root {
      --bg: #0b0b0b;
      --panel: rgba(18, 2, 6, 0.65);
      --line: rgba(255, 42, 84, 0.25);
      --pink: #ff2a54;
      --pink-deep: #c9183a;
      --cyan: rgba(0, 240, 255, 0.45);
      --blush: #ffe4ef;
      --text: #fff5f8;
      --mute: #c9a0ae;
      --ok: #9ad4b5;
      --danger: #ff2a54;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      background: transparent; color: var(--text);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }
    body {
      background:
        radial-gradient(ellipse at 72% 78%, rgba(255, 42, 84, 0.14), transparent 42%),
        radial-gradient(circle at 18% 12%, rgba(0, 240, 255, 0.06), transparent 36%),
        rgba(11, 11, 11, 0.55);
    }
    header {
      position: fixed; top: 10px; left: 12px; right: 12px; z-index: 8;
      padding: 8px 12px;
      background: rgba(18, 2, 6, 0.55);
      backdrop-filter: blur(14px) saturate(120%);
      -webkit-backdrop-filter: blur(14px) saturate(120%);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }
    #brand {
      margin: 0; font-size: 13px; letter-spacing: 0.32em; color: var(--pink); font-weight: 700;
      text-shadow: 0 0 12px rgba(255, 42, 84, 0.45);
    }
    #live {
      font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--ok); flex: 1; text-align: center; min-height: 1em;
    }
    #live.busy { color: #00f0ff; text-shadow: 0 0 10px rgba(0, 240, 255, 0.35); }
    .nav { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
    .nav a, .nav button {
      background: rgba(255, 42, 84, 0.12);
      color: var(--pink);
      border: 1px solid rgba(255, 42, 84, 0.35);
      padding: 5px 10px; cursor: pointer; font-size: 10px; letter-spacing: 0.08em;
      text-transform: uppercase; text-decoration: none; border-radius: 20px;
      transition: all 0.2s ease;
    }
    .nav a:hover, .nav button:hover {
      background: rgba(255, 42, 84, 0.28);
      color: #fff;
      box-shadow: 0 0 12px rgba(255, 42, 84, 0.4);
    }
    .stage { display: contents; }

    /* F.R.I.D.A.Y. holographic core */
    .orb-wrap {
      --voice: 0;
      --mood-a: rgba(255, 255, 255, 1);
      --mood-b: rgba(255, 42, 84, 0.85);
      position: fixed; right: 18px; bottom: 78px; z-index: 6;
      width: 132px; height: 132px;
      display: grid; place-items: center;
      pointer-events: auto;
    }
    .orb-wrap .ring, .orb-wrap .bubble { position: absolute; border-radius: 50%; pointer-events: none; }
    .orb-wrap .ring {
      inset: -6px;
      border: 1px dashed rgba(0, 240, 255, 0.35);
      opacity: 0.55;
      animation: FridaySpin 12s linear infinite;
    }
    .orb-wrap .ring:nth-of-type(2) {
      inset: 10px;
      border-style: solid;
      border-color: rgba(255, 42, 84, 0.25);
      animation-duration: 18s;
      animation-direction: reverse;
      opacity: 0.4;
    }
    .orb-wrap.thinking .ring, .orb-wrap.speaking .ring, .orb-wrap.listening .ring { opacity: 1; }
    .orb-wrap.thinking .ring:nth-of-type(1) {
      border-color: rgba(0, 240, 255, 0.55);
      animation: FridaySpin 4.2s linear infinite;
    }
    .orb-wrap.thinking .ring:nth-of-type(2) {
      inset: 16px;
      border-color: rgba(255, 42, 84, 0.55);
      animation: FridaySpin 2.8s linear infinite reverse;
    }
    .orb-wrap.speaking .ring {
      inset: 0;
      border-style: solid;
      border-color: rgba(255, 42, 84, 0.55);
      animation: ripple 1.1s ease-out infinite;
    }
    .orb-wrap.speaking .ring:nth-of-type(2) { animation-delay: 0.35s; }
    .orb-wrap.listening .ring:nth-of-type(1) {
      border-color: rgba(0, 240, 255, 0.65);
      box-shadow: 0 0 18px rgba(0, 240, 255, 0.25);
    }
    .orb-wrap .bubble {
      width: 7px; height: 7px;
      background: rgba(0, 240, 255, 0.85);
      opacity: 0;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.7);
    }
    .orb-wrap.thinking .bubble { opacity: 0.9; }
    .orb-wrap.thinking .b1 { animation: float-bit 3.2s ease-in-out infinite; left: 12px; top: 28px; }
    .orb-wrap.thinking .b2 { animation: float-bit 2.6s ease-in-out 0.4s infinite; right: 14px; top: 18px; width: 5px; height: 5px; background: #ff2a54; box-shadow: 0 0 10px rgba(255, 42, 84, 0.8); }
    .orb-wrap.thinking .b3 { animation: float-bit 3.8s ease-in-out 0.8s infinite; left: 40px; bottom: 10px; background: #ffe4ef; }

    .orb {
      width: 90px; height: 90px; border-radius: 50%; position: relative; z-index: 1;
      background: radial-gradient(circle at 35% 30%,
        rgba(255, 255, 255, 1) 0%,
        rgba(255, 42, 84, 0.85) 55%,
        rgba(255, 42, 84, 0.2) 100%);
      box-shadow:
        0 0 25px rgba(255, 42, 84, 0.6),
        0 0 50px rgba(255, 42, 84, 0.35),
        inset 0 0 18px rgba(255, 255, 255, 0.35);
      animation: FridayPulse 2.5s infinite ease-in-out;
      transition: transform 0.28s ease, box-shadow 0.35s ease, filter 0.35s ease, opacity 0.3s ease;
    }
    .orb::before {
      content: "";
      position: absolute;
      top: -15px; left: -15px; right: -15px; bottom: -15px;
      border: 1px dashed rgba(0, 240, 255, 0.4);
      border-radius: 50%;
      animation: FridaySpin 12s linear infinite;
      pointer-events: none;
    }
    .orb::after {
      content: ""; position: absolute; inset: 22px; border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: radial-gradient(circle at 40% 35%, rgba(255,255,255,0.55), transparent 70%);
      pointer-events: none;
    }
    .orb-wrap.mood-happy { --mood-a: #ffffff; --mood-b: rgba(255, 42, 84, 0.9); }
    .orb-wrap.mood-think { --mood-a: #e8fbff; --mood-b: rgba(0, 180, 220, 0.75); }
    .orb-wrap.mood-sad { --mood-a: #a8b4c0; --mood-b: rgba(80, 90, 110, 0.85); }
    .orb-wrap.mood-scare { --mood-a: #ffe0e8; --mood-b: rgba(255, 80, 100, 0.9); }
    .orb-wrap.shy .orb { animation: none; transform: scale(0.86); opacity: 0.75; }
    .orb-wrap.listening .orb {
      animation: none;
      transform: scale(calc(0.92 + var(--voice, 0) * 0.28));
      box-shadow:
        0 0 30px rgba(0, 240, 255, 0.45),
        0 0 55px rgba(255, 42, 84, 0.55),
        inset 0 0 18px rgba(255, 255, 255, 0.4);
    }
    .orb-wrap.thinking .orb {
      animation: FridayPulse 1.4s infinite ease-in-out;
      filter: saturate(1.15);
    }
    .orb-wrap.speaking .orb {
      animation: speak-joy 0.85s ease-in-out infinite;
      box-shadow:
        0 0 35px rgba(255, 42, 84, 0.85),
        0 0 70px rgba(255, 42, 84, 0.45),
        inset 0 0 20px rgba(255, 255, 255, 0.4);
    }
    .orb-wrap.mood-sad .orb { transform: translateY(8px) scale(0.96); animation: sad-pulse 3.2s ease-in-out infinite; }
    .orb-wrap.mood-scare .orb { animation: shiver 0.28s linear 4; }
    .orb-wrap.tickle .orb { animation: tickle 0.45s ease; }
    .orb-wrap.mood-happy:not(.listening):not(.thinking):not(.speaking) .orb {
      animation: hop-in 0.7s ease, FridayPulse 2.5s ease-in-out 0.7s infinite;
    }

    @keyframes FridayPulse {
      0% { transform: scale(0.96); opacity: 0.88; }
      50% {
        transform: scale(1.02); opacity: 1;
        box-shadow: 0 0 35px rgba(255, 42, 84, 0.8), 0 0 70px rgba(255, 42, 84, 0.45);
      }
      100% { transform: scale(0.96); opacity: 0.88; }
    }
    @keyframes FridaySpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes ripple {
      0% { transform: scale(0.92); opacity: 0.7; }
      100% { transform: scale(1.28); opacity: 0; }
    }
    @keyframes float-bit {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-14px); }
    }
    @keyframes speak-joy {
      0%, 100% { transform: scale(1.04); }
      50% { transform: scale(1.12); }
    }
    @keyframes sad-pulse {
      0%, 100% { transform: translateY(8px) scale(0.96); filter: brightness(0.9); }
      50% { transform: translateY(10px) scale(0.94); filter: brightness(0.82); }
    }
    @keyframes shiver {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }
    @keyframes tickle {
      0% { transform: scale(1); }
      40% { transform: scale(1.16); }
      100% { transform: scale(1); }
    }
    @keyframes hop-in {
      0% { transform: translateY(12px) scale(0.9); }
      60% { transform: translateY(-14px) scale(1.06); }
      100% { transform: translateY(0) scale(1); }
    }

    #caption {
      position: fixed;
      right: 158px;
      bottom: 92px;
      z-index: 7;
      max-width: min(320px, calc(100vw - 190px));
      padding: 12px 18px;
      border-radius: 16px 16px 4px 16px;
      background: rgba(18, 2, 6, 0.62);
      border: 1px solid rgba(255, 42, 84, 0.28);
      backdrop-filter: blur(16px) saturate(120%);
      -webkit-backdrop-filter: blur(16px) saturate(120%);
      color: var(--blush);
      font-size: 15px;
      line-height: 1.4;
      white-space: pre-wrap;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: opacity 0.45s ease, transform 0.45s ease;
    }
    #caption.show {
      opacity: 1;
      transform: translateY(0);
    }
    #caption.user-line { color: #f7e6ec; border-bottom-right-radius: 4px; border-bottom-left-radius: 16px; }
    #histBtn {
      position: fixed; right: 34px; bottom: 214px; z-index: 8;
      width: 36px; height: 36px; min-width: 36px; padding: 0;
      border-radius: 50%;
      background: rgba(18, 2, 6, 0.7);
      color: var(--pink);
      border: 1px solid rgba(255, 42, 84, 0.4);
      font-size: 14px;
      box-shadow: 0 0 14px rgba(255, 42, 84, 0.2);
    }
    .drawer {
      position: fixed;
      right: 16px;
      bottom: 258px;
      z-index: 9;
      width: min(360px, calc(100vw - 28px));
      height: min(420px, calc(100vh - 280px));
      display: flex;
      flex-direction: column;
      background: rgba(18, 2, 6, 0.72);
      backdrop-filter: blur(16px) saturate(120%);
      -webkit-backdrop-filter: blur(16px) saturate(120%);
      border: 1px solid rgba(255, 42, 84, 0.25);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(12px);
      transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s;
    }
    .drawer.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: none;
    }
    .drawer-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 12px; border-bottom: 1px solid rgba(255, 42, 84, 0.2);
      font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--pink);
    }
    .drawer-bar button {
      background: rgba(255, 42, 84, 0.12);
      color: var(--pink);
      border: 1px solid rgba(255, 42, 84, 0.35);
      padding: 4px 10px; font-size: 10px;
      border-radius: 20px;
    }
    #log {
      flex: 1; overflow-y: auto; padding: 8px 12px 12px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .msg {
      max-width: 88%; padding: 10px 14px; border-radius: 14px;
      font-size: 13px; line-height: 1.45; white-space: pre-wrap;
    }
    .msg.user {
      background: rgba(255, 42, 84, 0.12); align-self: flex-end;
      border-bottom-right-radius: 4px; color: #f7e6ec;
      border: 1px solid rgba(255, 42, 84, 0.28);
    }
    .msg.jarvis {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      align-self: flex-start; border-bottom-left-radius: 4px; color: var(--text);
    }

    /* Command bar — glass + flex */
    form#form {
      position: fixed; left: 12px; right: 160px; bottom: 14px; z-index: 8;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(18, 2, 6, 0.65);
      backdrop-filter: blur(16px) saturate(120%);
      -webkit-backdrop-filter: blur(16px) saturate(120%);
      border: 1px solid rgba(255, 42, 84, 0.25);
      border-radius: 24px;
      padding: 6px 14px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
    }
    form#form input[type=text] {
      flex: 1;
      background: transparent;
      border: none;
      padding: 10px 6px;
      border-radius: 0;
      color: #ffffff;
      outline: none;
      font-size: 13px;
      font-family: inherit;
    }
    form#form input[type=text]:focus {
      border: none;
      box-shadow: none;
    }
    form#form input[type=text]::placeholder { color: rgba(255, 245, 248, 0.45); }
    form#form > button[type=submit] {
      background: rgba(255, 42, 84, 0.15);
      border: 1px solid rgba(255, 42, 84, 0.4);
      color: #ff2a54;
      border-radius: 20px;
      padding: 6px 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      min-width: auto;
    }
    form#form > button[type=submit]:hover {
      background: rgba(255, 42, 84, 0.3);
      box-shadow: 0 0 12px rgba(255, 42, 84, 0.5);
      color: #ffffff;
      filter: none;
    }
    button.mic {
      background: rgba(255, 255, 255, 0.04);
      color: var(--blush);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      min-width: 44px;
      padding: 6px 12px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    button.mic:hover {
      border-color: rgba(0, 240, 255, 0.45);
      color: #00f0ff;
      filter: none;
    }
    button.mic.hot {
      background: rgba(255, 42, 84, 0.35);
      border-color: rgba(255, 42, 84, 0.7);
      color: #fff;
      box-shadow: 0 0 14px rgba(255, 42, 84, 0.55);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }
    @media (max-width: 640px) {
      form#form { right: 12px; }
      .orb-wrap { right: 10px; bottom: 72px; transform: scale(0.88); transform-origin: bottom right; }
      #caption { right: 12px; bottom: 210px; max-width: calc(100vw - 24px); }
    }
  </style>
</head>
<body>
  <header>
    <div id="brand">ILARIA</div>
    <div id="live">En línea</div>
    <div class="nav">
      <a href="/admin" id="adminLink" hidden>Dueño</a>
      <a href="/settings">Perfil</a>
      <button type="button" id="out">Salir</button>
    </div>
  </header>

  <div class="stage">
    <div class="orb-wrap mood-happy" id="orb" aria-hidden="true">
      <span class="ring"></span>
      <span class="ring"></span>
      <span class="bubble b1"></span>
      <span class="bubble b2"></span>
      <span class="bubble b3"></span>
      <div class="orb"></div>
    </div>
  </div>

  <div id="caption" class="" aria-live="polite"></div>
  <button type="button" id="histBtn" title="Historial (Ctrl+H)">☰</button>
  <aside id="history" class="drawer" aria-hidden="true">
    <div class="drawer-bar">
      <span>Historial</span>
      <button type="button" id="histClose">Ocultar</button>
    </div>
    <div id="log"></div>
  </aside>

  <form id="form">
    <button type="button" class="mic" id="mic" title="Hablar">Mic</button>
    <button type="button" class="mic hot" id="free" title="Siempre oye; solo responde si decís Ilaria">Oír</button>
    <input id="q" type="text" autocomplete="off" placeholder="Decime algo…" />
    <button type="submit">OK</button>
    <audio id="voice" style="display:none" preload="none"></audio>
  </form>

  <script>
    const log = document.getElementById("log");
    const form = document.getElementById("form");
    const q = document.getElementById("q");
    const mic = document.getElementById("mic");
    const freeBtn = document.getElementById("free");
    const live = document.getElementById("live");
    const voiceEl = document.getElementById("voice");
    const orb = document.getElementById("orb");
    const caption = document.getElementById("caption");
    const history = document.getElementById("history");
    const histBtn = document.getElementById("histBtn");
    const histClose = document.getElementById("histClose");
    histBtn.addEventListener("click", () => toggleHistory());
    histClose.addEventListener("click", () => toggleHistory(false));
    document.addEventListener("keydown", (ev) => {
      if ((ev.ctrlKey || ev.metaKey) && (ev.key === "h" || ev.key === "H")) {
        ev.preventDefault();
        toggleHistory();
      }
    });
    const canRecord = Boolean(navigator.mediaDevices && window.MediaRecorder);
    let captionTimer = 0;
    const WAKE = /\b(ilaria|hilaria|ilaría|oy[eé]\s+ilaria|hey\s+ilaria|ok\s+ilaria)\b/i;
    let stream = null;
    let analyser = null;
    let audioCtx = null;
    let recorder = null;
    let chunks = [];
    let handsFree = false;
    let handsSince = 0;
    let speaking = false;
    let lastTalk = 0;
    let voiceUrl = "";
    let busy = false;
    let mime = "";
    let sessionToken = "";
    let pushTalk = false;

    function setOrb(mode) {
      orb.classList.remove("thinking", "speaking", "listening", "shy", "tickle");
      if (mode === "thinking") {
        orb.classList.add("thinking", "mood-think");
        orb.classList.remove("mood-happy", "mood-sad", "mood-scare");
      } else if (mode === "speaking") {
        orb.classList.add("speaking", "mood-happy");
        orb.classList.remove("mood-think", "mood-sad", "mood-scare");
      } else if (mode === "listening") {
        orb.classList.add("shy");
        setTimeout(function () {
          orb.classList.remove("shy");
          if (!busy && !speaking) orb.classList.add("listening");
        }, 240);
      }
    }
    orb.addEventListener("click", function () {
      orb.classList.add("tickle");
      setTimeout(function () { orb.classList.remove("tickle"); }, 450);
    });

    function setLive(text, hot) {
      live.textContent = text || "En línea";
      live.classList.toggle("busy", Boolean(hot));
      if (!busy && !speaking) {
        if (handsFree || (text || "").toLowerCase().includes("escuch")) setOrb("listening");
        else setOrb("");
      }
    }

    function historyOpen() {
      return history.classList.contains("open");
    }

    function toggleHistory(force) {
      const open = typeof force === "boolean" ? force : !historyOpen();
      history.classList.toggle("open", open);
      history.setAttribute("aria-hidden", open ? "false" : "true");
    }

    function scheduleCaptionHide() {
      clearTimeout(captionTimer);
      const delay = (speaking || busy) ? 400 : 7000;
      captionTimer = setTimeout(() => {
        if (speaking || busy) {
          scheduleCaptionHide();
          return;
        }
        caption.classList.remove("show");
      }, delay);
    }

    function showCaption(text, role) {
      const line = (text || "").trim();
      if (!line) return;
      clearTimeout(captionTimer);
      caption.textContent = line;
      caption.classList.toggle("user-line", role === "user");
      caption.classList.add("show");
      scheduleCaptionHide();
    }

    function add(role, text) {
      const el = document.createElement("div");
      el.className = "msg " + role;
      el.textContent = text;
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
      showCaption(text, role);
    }

    function sleep(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    function withAuthToken(url) {
      if (!url || !sessionToken) return url;
      if (url.indexOf("/api/audio/") !== 0) return url;
      const join = url.indexOf("?") >= 0 ? "&" : "?";
      return url + join + "token=" + encodeURIComponent(sessionToken);
    }

    function rms() {
      // Client-side VAD for HUD Libre. Server Silero/RMS VAD runs on wake WAV before Whisper.
      if (!analyser) return 0;
      const data = new Uint8Array(analyser.fftSize);
      analyser.getByteTimeDomainData(data);
      let sum = 0;
      for (let i = 0; i < data.length; i++) {
        const v = (data[i] - 128) / 128;
        sum += v * v;
      }
      return Math.sqrt(sum / data.length);
    }

    async function ensureMic() {
      if (stream) {
        if (audioCtx && audioCtx.state === "suspended") await audioCtx.resume();
        return;
      }
      stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true },
      });
      audioCtx = new AudioContext();
      await audioCtx.resume();
      const src = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      src.connect(analyser);
      mime = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"].find((t) => MediaRecorder.isTypeSupported(t)) || "";
    }

    function stopVoice() {
      try { voiceEl.pause(); } catch (e) {}
      voiceEl.removeAttribute("src");
      if (voiceUrl) {
        URL.revokeObjectURL(voiceUrl);
        voiceUrl = "";
      }
      if (window.speechSynthesis) window.speechSynthesis.cancel();
    }

    function speakBrowser(text, done) {
      if (!window.speechSynthesis) { done(); return; }
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "es-AR";
      u.rate = 1.02;
      u.onend = done;
      u.onerror = done;
      window.speechSynthesis.speak(u);
      setTimeout(done, Math.min(25000, Math.max(2000, text.length * 90)));
    }

    async function speak(text) {
      const clipped = (text || "").trim().slice(0, 1800);
      if (!clipped) return;
      speaking = true;
      setOrb("speaking");
      let finished = false;
      const done = () => {
        if (finished) return;
        finished = true;
        speaking = false;
        lastTalk = Date.now();
        voiceEl.onended = null;
        voiceEl.onerror = null;
        stopVoice();
        setOrb(handsFree ? "listening" : "");
      };
      stopVoice();
      try {
        const res = await fetch("/api/tts", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: clipped }),
        });
        if (!res.ok) throw new Error("tts");
        const blob = await res.blob();
        voiceUrl = URL.createObjectURL(blob);
        voiceEl.src = voiceUrl;
        voiceEl.onended = done;
        voiceEl.onerror = () => speakBrowser(clipped, done);
        await voiceEl.play();
        setTimeout(done, Math.min(60000, 2500 + clipped.length * 80));
      } catch (e) {
        speakBrowser(clipped, done);
      }
    }

    async function playAudioUrl(url, fallbackText) {
      if (!url) {
        await speak(fallbackText || "");
        return;
      }
      speaking = true;
      setOrb("speaking");
      let finished = false;
      const done = () => {
        if (finished) return;
        finished = true;
        speaking = false;
        lastTalk = Date.now();
        voiceEl.onended = null;
        voiceEl.onerror = null;
        stopVoice();
        setOrb(handsFree ? "listening" : "");
      };
      stopVoice();
      try {
        voiceEl.src = withAuthToken(url);
        voiceEl.onended = done;
        voiceEl.onerror = () => speak(fallbackText || "");
        await voiceEl.play();
        setTimeout(done, 60000);
      } catch (e) {
        await speak(fallbackText || "");
      }
    }

    function fromHandsFree(raw) {
      const text = (raw || "").trim();
      if (!text) return "";
      const woke = WAKE.test(text);
      const follow = lastTalk > 0 && Date.now() - lastTalk < 22000;
      if (!woke && !follow) return "";
      const cleaned = text.replace(WAKE, " ").replace(/\s+/g, " ").trim();
      if (woke && !cleaned) return "hola";
      return cleaned || text;
    }

    let lastSttErr = 0;

    async function transcribe(blob, { quiet = false } = {}) {
      if (!blob || blob.size < 1200) return "";
      const fd = new FormData();
      fd.append("file", blob, mime.includes("mp4") ? "audio.mp4" : "audio.webm");
      try {
        const res = await fetch("/api/stt", { method: "POST", body: fd });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          if (!quiet || Date.now() - lastSttErr > 12000) {
            lastSttErr = Date.now();
            const msg = typeof data.detail === "string" ? data.detail : "No pude transcribir.";
            add("jarvis", msg);
          }
          return "";
        }
        return (data.text || "").trim();
      } catch (err) {
        if (!quiet || Date.now() - lastSttErr > 12000) {
          lastSttErr = Date.now();
          add("jarvis", "No pude transcribir: falló la red local.");
        }
        return "";
      }
    }

    async function recordUtterance(maxMs) {
      chunks = [];
      recorder = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
      recorder.ondataavailable = (ev) => { if (ev.data && ev.data.size) chunks.push(ev.data); };
      recorder.start(200);
      mic.classList.add("hot");
      setLive(handsFree ? "escuchando — decí Ilaria" : "escuchando", true);
      setOrb("listening");
      const started = Date.now();
      let heard = false;
      let quiet = 0;
      while (Date.now() - started < maxMs) {
        await sleep(80);
        const level = rms();
        orb.style.setProperty("--voice", Math.min(1, level / 0.12).toFixed(3));
        if (level > 0.035) {
          heard = true;
          quiet = 0;
        } else if (heard) {
          quiet += 80;
          if (quiet >= 900) break;
        } else if (Date.now() - started > 4500) {
          break;
        }
      }
      await new Promise((resolve) => {
        recorder.onstop = resolve;
        try { recorder.stop(); } catch (e) { resolve(); }
      });
      mic.classList.remove("hot");
      return new Blob(chunks, { type: recorder.mimeType || mime || "audio/webm" });
    }

    async function send(text) {
      if (!text.trim() || busy) return;
      busy = true;
      add("user", text);
      q.value = "";
      setLive("pensando…", true);
      setOrb("thinking");
      const el = document.createElement("div");
      el.className = "msg jarvis";
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
      try {
        const res = await fetch("/api/chat/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, speak: true }),
        });
        if (!res.ok || !res.body) {
          let detail = "No pude responder.";
          try {
            const data = await res.json();
            detail = data.detail || data.error || detail;
          } catch (e) {}
          el.textContent = detail;
          showCaption(detail, "jarvis");
          return;
        }
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buf = "";
        let audioUrl = "";
        let finalReply = "";
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          const blocks = buf.split("\n\n");
          buf = blocks.pop() || "";
          for (let i = 0; i < blocks.length; i++) {
            const block = blocks[i].trim();
            if (!block) continue;
            let eventName = "message";
            const dataLines = [];
            block.split("\n").forEach((line) => {
              if (line.startsWith("event:")) eventName = line.slice(6).trim();
              if (line.startsWith("data:")) dataLines.push(line.slice(5).trim());
            });
            if (!dataLines.length) continue;
            let data = {};
            try { data = JSON.parse(dataLines.join("\n")); } catch (e) { continue; }
            if (eventName === "token" && data.text) {
              el.textContent += data.text;
              showCaption(el.textContent, "jarvis");
              log.scrollTop = log.scrollHeight;
            }
            if (eventName === "error") {
              el.textContent = data.detail || "Error en el stream.";
              showCaption(el.textContent, "jarvis");
            }
            if (eventName === "done") {
              finalReply = data.reply || el.textContent;
              el.textContent = finalReply;
              audioUrl = data.audio_url || "";
              showCaption(finalReply, "jarvis");
            }
          }
        }
        setLive("hablando…", true);
        await playAudioUrl(audioUrl, finalReply || el.textContent);
      } finally {
        busy = false;
        setLive(handsFree ? "escuchando — decí Ilaria" : "En línea", handsFree);
      }
    }

    async function talkOnce() {
      if (busy || speaking || pushTalk) return;
      pushTalk = true;
      try {
        await ensureMic();
      } catch (err) {
        add("jarvis", "Micrófono bloqueado. Permitilo o abrí http://localhost:8787 en Edge/Chrome.");
        pushTalk = false;
        return;
      }
      const blob = await recordUtterance(18000);
      setLive("procesando voz…", true);
      setOrb("thinking");
      const text = await transcribe(blob);
      pushTalk = false;
      if (text) await send(text);
      else setLive(handsFree ? "escuchando — decí Ilaria" : "En línea", handsFree);
    }

    async function handsLoop() {
      setLive("escuchando — decí Ilaria", true);
      setOrb("listening");
      try {
        await ensureMic();
      } catch (err) {
        handsFree = false;
        freeBtn.classList.remove("hot");
        add("jarvis", "Micrófono bloqueado.");
        setLive("En línea");
        return;
      }
      while (handsFree) {
        if (busy || speaking || pushTalk) {
          await sleep(200);
          continue;
        }
        let startRec = false;
        let voiced = 0;
        const waitStart = Date.now();
        while (handsFree && !busy && !speaking && !pushTalk && Date.now() - waitStart < 120000) {
          await sleep(60);
          if (rms() > 0.055) {
            voiced += 60;
            if (voiced >= 180) {
              startRec = true;
              break;
            }
          } else {
            voiced = 0;
          }
        }
        if (!handsFree || busy || speaking || !startRec) continue;
        const blob = await recordUtterance(14000);
        if (!handsFree || busy || speaking) continue;
        if (!blob || blob.size < 1800) {
          if (handsFree) setLive("escuchando — decí Ilaria", true);
          await sleep(400);
          continue;
        }
        setLive("procesando voz…", true);
        setOrb("thinking");
        const text = await transcribe(blob, { quiet: true });
        const gated = fromHandsFree(text);
        if (handsFree && gated) await send(gated);
        else if (handsFree) {
          setLive("escuchando — decí Ilaria", true);
          await sleep(700);
        }
      }
      setLive("En línea");
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      send(q.value);
    });

    if (!canRecord) {
      mic.hidden = true;
      freeBtn.hidden = true;
    }

    mic.addEventListener("click", () => {
      if (busy) return;
      talkOnce();
    });

    freeBtn.addEventListener("click", () => {
      handsFree = !handsFree;
      freeBtn.classList.toggle("hot", handsFree);
      freeBtn.textContent = handsFree ? "Oír" : "Mute";
      if (handsFree) {
        handsLoop();
      } else {
        setLive("En línea");
        setOrb("");
      }
    });

    (async () => {
      const me = await fetch("/api/me");
      if (!me.ok) { location.href = "/welcome"; return; }
      const data = await me.json();
      if (data.token) sessionToken = data.token;
      const name = (data.user && data.user.display_name) || "";
      const assistant = (data.status && data.status.name) || "Ilaria";
      document.title = assistant;
      document.getElementById("brand").textContent = assistant.toUpperCase();
      if (data.user && data.user.is_owner) {
        document.getElementById("adminLink").hidden = false;
      }
      let greeted = false;
      try {
        const welcome = await fetch("/api/welcome-report");
        if (welcome.ok) {
          const report = await welcome.json();
          const line = report.voice_text || report.ui_display;
          if (line) {
            add("jarvis", line);
            setLive("hablando…", true);
            await playAudioUrl(report.audio_url, line);
            greeted = true;
          }
        }
      } catch (e) {}
      if (!greeted) {
        add("jarvis", name ? "Hola " + name + ", ya estoy acá." : "Hola… ya estoy acá.");
      }
      if (!data.has_llm) {
        add("jarvis", "Sin Ollama ni key. Clima, notas y búsqueda andan; para charla completa levantá gemma2:2b o pegá Groq en Perfil.");
      }
      if (canRecord) {
        handsFree = true;
        freeBtn.classList.add("hot");
        freeBtn.textContent = "Oír";
        setLive("escuchando — decí Ilaria", true);
        handsLoop();
      } else {
        setLive("En línea");
      }
    })();

    document.getElementById("out").onclick = async () => {
      await fetch("/api/logout", { method: "POST" });
      location.href = "/welcome";
    };

    let alertAfter = 0;
    async function pollAlerts() {
      try {
        const res = await fetch("/api/alerts?after=" + alertAfter);
        const data = await res.json();
        for (const item of data.items || []) {
          alertAfter = Math.max(alertAfter, item.id);
          add("jarvis", item.text);
          setLive("aviso", true);
          if (item.audio_url) await playAudioUrl(item.audio_url, item.text);
          else await speak(item.text);
        }
      } catch (e) {}
    }
    setInterval(pollAlerts, 4000);
  </script>
