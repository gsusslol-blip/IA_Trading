<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ILARIA</title>
  <link rel="icon" href="/favicon.svg" />
  <style>
    :root {
      --bg-dark-absolute: #070709;
      --bg-panel: #121216;
      --bg-input: #1a1a22;
      --accent-friday: #ff2a54;
      --accent-stark: #00f0ff;
      --text-main: #ffffff;
      --text-muted: #8e8e9f;
      --border-color: rgba(255, 255, 255, 0.06);
      --pink: #ff2a54;
      --blush: #ffe4ef;
      --ok: #00ff66;
      --danger: #ff2a54;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      background: var(--bg-dark-absolute);
      color: var(--text-main);
      font-family: "Segoe UI", system-ui, sans-serif;
      overflow: hidden;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: stretch;
      padding: 14px;
      background:
        radial-gradient(ellipse at 70% 30%, rgba(255, 42, 84, 0.08), transparent 45%),
        radial-gradient(circle at 15% 80%, rgba(0, 240, 255, 0.05), transparent 40%),
        var(--bg-dark-absolute);
    }
    .dashboard-container {
      display: grid;
      grid-template-columns: minmax(220px, 280px) minmax(0, 1fr) minmax(220px, 300px);
      gap: 16px;
      width: min(1280px, 100%);
      height: 100%;
      min-height: 0;
    }
    .sidebar-left, .sidebar-right, .main-core {
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 22px;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .sidebar-left, .sidebar-right { padding: 20px; }
    .brand-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 18px;
    }
    #brand {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0.28em;
      color: var(--accent-friday);
      font-weight: 700;
      text-shadow: 0 0 16px rgba(255, 42, 84, 0.35);
    }
    #live, .status-badge {
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ok);
      background: rgba(0, 255, 102, 0.08);
      border: 1px solid rgba(0, 255, 102, 0.25);
      border-radius: 999px;
      padding: 5px 10px;
      white-space: nowrap;
    }
    #live.busy {
      color: var(--accent-stark);
      background: rgba(0, 240, 255, 0.08);
      border-color: rgba(0, 240, 255, 0.3);
    }
    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }
    .nav a, .nav button, #histBtn, #histClose, .drawer-bar button {
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 7px 12px;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      transition: 0.2s ease;
    }
    .nav a:hover, .nav button:hover, #histBtn:hover, #histClose:hover {
      color: #fff;
      border-color: rgba(255, 42, 84, 0.4);
      background: rgba(255, 42, 84, 0.12);
    }
    .history-section h3, .widget-box h3 {
      margin: 0 0 12px;
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-weight: 600;
    }
    #history {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: none;
      position: static;
      width: auto;
      height: auto;
      background: transparent;
      border: none;
      border-radius: 0;
      box-shadow: none;
    }
    .drawer-bar {
      display: none;
    }
    #log {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 4px;
      min-height: 0;
    }
    .msg {
      max-width: 100%;
      padding: 12px 14px;
      border-radius: 16px;
      font-size: 13px;
      line-height: 1.45;
      white-space: pre-wrap;
    }
    .msg.user {
      align-self: flex-end;
      background: rgba(255, 42, 84, 0.12);
      border: 1px solid rgba(255, 42, 84, 0.22);
      color: #f7e6ec;
      border-bottom-right-radius: 4px;
    }
    .msg.jarvis {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-bottom-left-radius: 4px;
    }
    .main-core {
      padding: 28px 28px 22px;
      position: relative;
      overflow: hidden;
      justify-content: space-between;
    }
    .main-core::before {
      content: "";
      position: absolute;
      inset: -40% auto auto 30%;
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, rgba(255, 42, 84, 0.12), transparent 70%);
      pointer-events: none;
    }
    .voice-module {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      position: relative;
      z-index: 1;
      min-height: 0;
    }
    .orb-wrap {
      --voice: 0;
      width: 180px;
      height: 180px;
      position: relative;
      display: grid;
      place-items: center;
      pointer-events: auto;
    }
    .orb-wrap .ring, .orb-wrap .bubble { position: absolute; border-radius: 50%; pointer-events: none; }
    .orb-wrap .ring {
      inset: -4px;
      border: 1px dashed rgba(0, 240, 255, 0.35);
      opacity: 0.5;
      animation: FridaySpin 12s linear infinite;
    }
    .orb-wrap .ring:nth-of-type(2) {
      inset: 14px;
      border-style: solid;
      border-color: rgba(255, 42, 84, 0.22);
      animation-duration: 18s;
      animation-direction: reverse;
    }
    .orb-wrap.thinking .ring, .orb-wrap.speaking .ring, .orb-wrap.listening .ring { opacity: 1; }
    .orb-wrap.thinking .ring:nth-of-type(1) {
      border-color: rgba(0, 240, 255, 0.55);
      animation: FridaySpin 4.2s linear infinite;
    }
    .orb-wrap.thinking .ring:nth-of-type(2) {
      inset: 22px;
      border-color: rgba(255, 42, 84, 0.5);
      animation: FridaySpin 2.8s linear infinite reverse;
    }
    .orb-wrap.speaking .ring {
      inset: 0;
      border-style: solid;
      border-color: rgba(255, 42, 84, 0.55);
      animation: ripple 1.1s ease-out infinite;
    }
    .orb-wrap.speaking .ring:nth-of-type(2) { animation-delay: 0.35s; }
    .orb-wrap .bubble {
      width: 7px; height: 7px;
      background: rgba(0, 240, 255, 0.85);
      opacity: 0;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.7);
    }
    .orb-wrap.thinking .bubble { opacity: 0.9; }
    .orb-wrap.thinking .b1 { animation: float-bit 3.2s ease-in-out infinite; left: 18px; top: 40px; }
    .orb-wrap.thinking .b2 { animation: float-bit 2.6s ease-in-out 0.4s infinite; right: 22px; top: 28px; width: 5px; height: 5px; background: #ff2a54; }
    .orb-wrap.thinking .b3 { animation: float-bit 3.8s ease-in-out 0.8s infinite; left: 56px; bottom: 18px; background: #ffe4ef; }
    .orb {
      width: 110px; height: 110px; border-radius: 50%; position: relative; z-index: 1;
      background: radial-gradient(circle at 35% 30%, #fff 0%, rgba(255,42,84,0.9) 55%, rgba(255,42,84,0.15) 100%);
      box-shadow: 0 0 30px rgba(255,42,84,0.65), 0 0 70px rgba(255,42,84,0.3), inset 0 0 18px rgba(255,255,255,0.35);
      animation: FridayPulse 2.5s infinite ease-in-out;
      transition: transform 0.28s ease, box-shadow 0.35s ease, filter 0.35s ease;
    }
    .orb::before {
      content: "";
      position: absolute;
      inset: -18px;
      border: 1px dashed rgba(0, 240, 255, 0.4);
      border-radius: 50%;
      animation: FridaySpin 12s linear infinite;
      pointer-events: none;
    }
    .orb::after {
      content: "";
      position: absolute;
      inset: 28px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.35);
      background: radial-gradient(circle at 40% 35%, rgba(255,255,255,0.55), transparent 70%);
      pointer-events: none;
    }
    .orb-wrap.shy .orb { animation: none; transform: scale(0.86); opacity: 0.75; }
    .orb-wrap.listening .orb {
      animation: none;
      transform: scale(calc(0.92 + var(--voice, 0) * 0.28));
      box-shadow: 0 0 34px rgba(0,240,255,0.4), 0 0 60px rgba(255,42,84,0.5), inset 0 0 18px rgba(255,255,255,0.4);
    }
    .orb-wrap.thinking .orb { animation: FridayPulse 1.4s infinite ease-in-out; }
    .orb-wrap.speaking .orb {
      animation: speak-joy 0.85s ease-in-out infinite;
      box-shadow: 0 0 40px rgba(255,42,84,0.85), 0 0 80px rgba(255,42,84,0.4);
    }
    .orb-wrap.mood-sad .orb { transform: translateY(8px) scale(0.96); animation: sad-pulse 3.2s ease-in-out infinite; }
    .orb-wrap.mood-scare .orb { animation: shiver 0.28s linear 4; }
    .orb-wrap.tickle .orb { animation: tickle 0.45s ease; }
    .orb-wrap.mood-happy:not(.listening):not(.thinking):not(.speaking) .orb {
      animation: hop-in 0.7s ease, FridayPulse 2.5s ease-in-out 0.7s infinite;
    }
    #waveform {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 6px;
      height: 48px;
      opacity: 0.35;
      transition: opacity 0.25s ease;
    }
    #waveform.active { opacity: 1; }
    #waveform.hot .wave-bar { background: var(--accent-friday); }
    .wave-bar {
      width: 4px;
      height: 14px;
      background: var(--accent-stark);
      border-radius: 2px;
      animation: soundWavePulse 1.2s infinite ease-in-out;
      transform-origin: center bottom;
    }
    .wave-bar:nth-child(2) { animation-delay: 0.15s; }
    .wave-bar:nth-child(3) { animation-delay: 0.3s; }
    .wave-bar:nth-child(4) { animation-delay: 0.1s; }
    .wave-bar:nth-child(5) { animation-delay: 0.25s; }
    .wave-bar:nth-child(6) { animation-delay: 0.35s; }
    .wave-bar:nth-child(7) { animation-delay: 0.05s; }
    #caption {
      max-width: min(520px, 92%);
      text-align: center;
      padding: 12px 18px;
      border-radius: 16px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border-color);
      color: var(--blush);
      font-size: 15px;
      line-height: 1.4;
      white-space: pre-wrap;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.35s ease, transform 0.35s ease;
      pointer-events: none;
    }
    #caption.show { opacity: 1; transform: none; }
    #caption.user-line { color: #f7e6ec; }
    form#form {
      position: relative;
      left: auto; right: auto; bottom: auto;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg-input);
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 28px;
      padding: 8px 12px;
      margin-top: 12px;
    }
    form#form input[type=text] {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-main);
      outline: none;
      font-size: 15px;
      padding: 10px 6px;
    }
    form#form input[type=text]::placeholder { color: var(--text-muted); }
    form#form > button[type=submit] {
      background: var(--accent-friday);
      color: #fff;
      border: none;
      border-radius: 20px;
      padding: 8px 18px;
      font-weight: 700;
      cursor: pointer;
    }
    form#form > button[type=submit]:hover {
      box-shadow: 0 0 16px rgba(255, 42, 84, 0.45);
    }
    button.mic {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      min-width: 52px;
      padding: 8px 12px;
      font-weight: 600;
      cursor: pointer;
    }
    button.mic:hover { color: var(--accent-stark); border-color: rgba(0,240,255,0.35); }
    button.mic.hot {
      color: #fff;
      background: rgba(255, 42, 84, 0.35);
      border-color: rgba(255, 42, 84, 0.7);
      box-shadow: 0 0 14px rgba(255, 42, 84, 0.45);
      animation: pulse 1.5s infinite;
    }
    .widget-box {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .metric-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      font-size: 13px;
      color: var(--text-muted);
    }
    .metric-row:last-child { border-bottom: none; }
    .metric-row strong { color: var(--text-main); font-weight: 600; }
    .text-green { color: var(--ok) !important; }
    .text-warn { color: #ffb020 !important; }
    #histBtn {
      display: none;
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 20;
    }
    @keyframes FridayPulse {
      0% { transform: scale(0.96); opacity: 0.88; }
      50% { transform: scale(1.03); opacity: 1; box-shadow: 0 0 40px rgba(255,42,84,0.8), 0 0 80px rgba(255,42,84,0.4); }
      100% { transform: scale(0.96); opacity: 0.88; }
    }
    @keyframes FridaySpin { to { transform: rotate(360deg); } }
    @keyframes ripple {
      0% { transform: scale(0.92); opacity: 0.7; }
      100% { transform: scale(1.28); opacity: 0; }
    }
    @keyframes float-bit {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-14px); }
    }
    @keyframes speak-joy {
      0%, 100% { transform: scale(1.04); }
      50% { transform: scale(1.12); }
    }
    @keyframes sad-pulse {
      0%, 100% { transform: translateY(8px) scale(0.96); filter: brightness(0.9); }
      50% { transform: translateY(10px) scale(0.94); filter: brightness(0.82); }
    }
    @keyframes shiver {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }
    @keyframes tickle {
      0% { transform: scale(1); }
      40% { transform: scale(1.16); }
      100% { transform: scale(1); }
    }
    @keyframes hop-in {
      0% { transform: translateY(12px) scale(0.9); }
      60% { transform: translateY(-14px) scale(1.06); }
      100% { transform: translateY(0) scale(1); }
    }
    @keyframes soundWavePulse {
      0%, 100% { transform: scaleY(0.45); }
      50% { transform: scaleY(1.15); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }
    @media (max-width: 980px) {
      body { padding: 8px; }
      .dashboard-container {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr auto;
        overflow: auto;
        height: auto;
        min-height: 100%;
      }
      .sidebar-right { order: 3; }
      .main-core { order: 1; min-height: 62vh; }
      .sidebar-left { order: 2; max-height: 40vh; }
      #histBtn { display: inline-flex; align-items: center; justify-content: center; }
      #history:not(.open) #log { display: none; }
    }
  </style>
</head>
<body>
  <div class="dashboard-container">
    <aside class="sidebar-left">
      <div class="brand-header">
        <h2 id="brand">ILARIA</h2>
        <div id="live" class="status-badge">En línea</div>
      </div>
      <div class="nav">
        <a href="/admin" id="adminLink" hidden>Dueño</a>
        <a href="/settings">Perfil</a>
        <button type="button" id="out">Salir</button>
        <button type="button" id="histClose" title="Colapsar historial">Hist</button>
      </div>
      <div class="history-section" style="flex:1;min-height:0;display:flex;flex-direction:column;">
        <h3>Historial táctico</h3>
        <aside id="history" class="open" aria-hidden="false">
          <div class="drawer-bar"><span>Historial</span></div>
          <div id="log"></div>
        </aside>
      </div>
    </aside>

    <main class="main-core">
      <div class="voice-module">
        <div class="orb-wrap mood-happy" id="orb" aria-hidden="true">
          <span class="ring"></span>
          <span class="ring"></span>
          <span class="bubble b1"></span>
          <span class="bubble b2"></span>
          <span class="bubble b3"></span>
          <div class="orb"></div>
        </div>
        <div class="waveform-container" id="waveform" aria-hidden="true">
          <span class="wave-bar"></span>
          <span class="wave-bar"></span>
          <span class="wave-bar"></span>
          <span class="wave-bar"></span>
          <span class="wave-bar"></span>
          <span class="wave-bar"></span>
          <span class="wave-bar"></span>
        </div>
        <div id="caption" class="" aria-live="polite"></div>
      </div>
      <form id="form">
        <button type="button" class="mic" id="mic" title="Hablar">Mic</button>
        <button type="button" class="mic hot" id="free" title="Siempre oye; solo responde si decís Ilaria">Oír</button>
        <input id="q" type="text" autocomplete="off" placeholder="escribe una frase" />
        <button type="submit">OK</button>
        <audio id="voice" style="display:none" preload="none"></audio>
      </form>
    </main>

    <aside class="sidebar-right">
      <div class="widget-box">
        <h3>Misión</h3>
        <div class="metric-row"><span>Pack</span><strong id="metric-pack">—</strong></div>
        <div class="metric-row"><span>Próximo</span><strong id="metric-next">—</strong></div>
        <div class="metric-row"><span>Última acción</span><strong id="metric-action">—</strong></div>
        <div class="metric-row"><span>Continuidad</span><strong id="metric-continue">—</strong></div>
      </div>
      <div class="widget-box">
        <h3>Estado</h3>
        <div class="metric-row"><span>Ollama LLM</span><strong class="text-green" id="metric-ollama">—</strong></div>
        <div class="metric-row"><span>Puerto HUD</span><strong id="metric-port">—</strong></div>
        <div class="metric-row"><span>Voz</span><strong id="metric-tts">—</strong></div>
        <div class="metric-row"><span>Latencia</span><strong id="metric-lat">—</strong></div>
        <div class="metric-row"><span>Versión</span><strong id="metric-version">—</strong></div>
      </div>
      <div class="widget-box">
        <h3>Dispositivo móvil</h3>
        <div class="metric-row"><span>Android min</span><strong id="metric-android">—</strong></div>
        <div class="metric-row"><span>Canal PC</span><span id="queue-count">local-first</span></div>
      </div>
    </aside>
  </div>
  <button type="button" id="histBtn" title="Historial (Ctrl+H)">Hist</button>

  <script>
    const log = document.getElementById("log");
    const form = document.getElementById("form");
    const q = document.getElementById("q");
    const mic = document.getElementById("mic");
    const freeBtn = document.getElementById("free");
    const live = document.getElementById("live");
    const voiceEl = document.getElementById("voice");
    const orb = document.getElementById("orb");
    const caption = document.getElementById("caption");
    const history = document.getElementById("history");
    const histBtn = document.getElementById("histBtn");
    const histClose = document.getElementById("histClose");
    histBtn.addEventListener("click", () => toggleHistory());
    histClose.addEventListener("click", () => toggleHistory(false));
    document.addEventListener("keydown", (ev) => {
      if ((ev.ctrlKey || ev.metaKey) && (ev.key === "h" || ev.key === "H")) {
        ev.preventDefault();
        toggleHistory();
      }
    });
    const canRecord = Boolean(navigator.mediaDevices && window.MediaRecorder);
    let captionTimer = 0;
    const WAKE = /\b(ilaria|hilaria|ilaría|oy[eé]\s+ilaria|hey\s+ilaria|ok\s+ilaria)\b/i;
    let stream = null;
    let analyser = null;
    let audioCtx = null;
    let recorder = null;
    let chunks = [];
    let handsFree = false;
    let handsSince = 0;
    let speaking = false;
    let lastTalk = 0;
    let voiceUrl = "";
    let busy = false;
    let mime = "";
    let sessionToken = "";
    let pushTalk = false;

    const waveform = document.getElementById("waveform");
    function syncWave() {
      if (!waveform) return;
      const on = orb.classList.contains("listening") || orb.classList.contains("speaking") || orb.classList.contains("thinking");
      waveform.classList.toggle("active", on);
      waveform.classList.toggle("hot", orb.classList.contains("listening") || mic.classList.contains("hot"));
    }
    function setOrb(mode) {
      orb.classList.remove("thinking", "speaking", "listening", "shy", "tickle");
      if (mode === "thinking") {
        orb.classList.add("thinking", "mood-think");
        orb.classList.remove("mood-happy", "mood-sad", "mood-scare");
      } else if (mode === "speaking") {
        orb.classList.add("speaking", "mood-happy");
        orb.classList.remove("mood-think", "mood-sad", "mood-scare");
      } else if (mode === "listening") {
        orb.classList.add("shy");
        setTimeout(function () {
          orb.classList.remove("shy");
          if (!busy && !speaking) orb.classList.add("listening");
          syncWave();
        }, 240);
      }
      syncWave();
    }
    orb.addEventListener("click", function () {
      orb.classList.add("tickle");
      setTimeout(function () { orb.classList.remove("tickle"); }, 450);
    });

    function setLive(text, hot) {
      live.textContent = text || "En línea";
      live.classList.toggle("busy", Boolean(hot));
      if (!busy && !speaking) {
        if (handsFree || (text || "").toLowerCase().includes("escuch")) setOrb("listening");
        else setOrb("");
      }
    }

    function historyOpen() {
      return history.classList.contains("open");
    }

    function toggleHistory(force) {
      const open = typeof force === "boolean" ? force : !historyOpen();
      history.classList.toggle("open", open);
      history.setAttribute("aria-hidden", open ? "false" : "true");
    }

    function scheduleCaptionHide() {
      clearTimeout(captionTimer);
      const delay = (speaking || busy) ? 400 : 7000;
      captionTimer = setTimeout(() => {
        if (speaking || busy) {
          scheduleCaptionHide();
          return;
        }
        caption.classList.remove("show");
      }, delay);
    }

    function showCaption(text, role) {
      const line = (text || "").trim();
      if (!line) return;
      clearTimeout(captionTimer);
      caption.textContent = line;
      caption.classList.toggle("user-line", role === "user");
      caption.classList.add("show");
      scheduleCaptionHide();
    }

    function add(role, text) {
      const el = document.createElement("div");
      el.className = "msg " + role;
      el.textContent = text;
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
      showCaption(text, role);
    }

    function sleep(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    function withAuthToken(url) {
      if (!url || !sessionToken) return url;
      if (url.indexOf("/api/audio/") !== 0) return url;
      const join = url.indexOf("?") >= 0 ? "&" : "?";
      return url + join + "token=" + encodeURIComponent(sessionToken);
    }

    function rms() {
      // Client-side VAD for HUD Libre. Server Silero/RMS VAD runs on wake WAV before Whisper.
      if (!analyser) return 0;
      const data = new Uint8Array(analyser.fftSize);
      analyser.getByteTimeDomainData(data);
      let sum = 0;
      for (let i = 0; i < data.length; i++) {
        const v = (data[i] - 128) / 128;
        sum += v * v;
      }
      return Math.sqrt(sum / data.length);
    }

    async function ensureMic() {
      if (stream) {
        if (audioCtx && audioCtx.state === "suspended") await audioCtx.resume();
        return;
      }
      stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true },
      });
      audioCtx = new AudioContext();
      await audioCtx.resume();
      const src = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      src.connect(analyser);
      mime = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"].find((t) => MediaRecorder.isTypeSupported(t)) || "";
    }

    function stopVoice() {
      try { voiceEl.pause(); } catch (e) {}
      voiceEl.removeAttribute("src");
      if (voiceUrl) {
        URL.revokeObjectURL(voiceUrl);
        voiceUrl = "";
      }
      if (window.speechSynthesis) window.speechSynthesis.cancel();
    }

    function speakBrowser(text, done) {
      if (!window.speechSynthesis) { done(); return; }
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "es-AR";
      u.rate = 1.02;
      u.onend = done;
      u.onerror = done;
      window.speechSynthesis.speak(u);
      setTimeout(done, Math.min(25000, Math.max(2000, text.length * 90)));
    }

    async function speak(text) {
      const clipped = (text || "").trim().slice(0, 1800);
      if (!clipped) return;
      speaking = true;
      setOrb("speaking");
      let finished = false;
      const done = () => {
        if (finished) return;
        finished = true;
        speaking = false;
        lastTalk = Date.now();
        voiceEl.onended = null;
        voiceEl.onerror = null;
        stopVoice();
        setOrb(handsFree ? "listening" : "");
      };
      stopVoice();
      try {
        const res = await fetch("/api/tts", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: clipped }),
        });
        if (!res.ok) throw new Error("tts");
        const blob = await res.blob();
        voiceUrl = URL.createObjectURL(blob);
        voiceEl.src = voiceUrl;
        voiceEl.onended = done;
        voiceEl.onerror = () => speakBrowser(clipped, done);
        await voiceEl.play();
        setTimeout(done, Math.min(60000, 2500 + clipped.length * 80));
      } catch (e) {
        speakBrowser(clipped, done);
      }
    }

    async function playAudioUrl(url, fallbackText) {
      if (!url) {
        await speak(fallbackText || "");
        return;
      }
      speaking = true;
      setOrb("speaking");
      let finished = false;
      const done = () => {
        if (finished) return;
        finished = true;
        speaking = false;
        lastTalk = Date.now();
        voiceEl.onended = null;
        voiceEl.onerror = null;
        stopVoice();
        setOrb(handsFree ? "listening" : "");
      };
      stopVoice();
      try {
        voiceEl.src = withAuthToken(url);
        voiceEl.onended = done;
        voiceEl.onerror = () => speak(fallbackText || "");
        await voiceEl.play();
        setTimeout(done, 60000);
      } catch (e) {
        await speak(fallbackText || "");
      }
    }

    function fromHandsFree(raw) {
      const text = (raw || "").trim();
      if (!text) return "";
      const woke = WAKE.test(text);
      const follow = lastTalk > 0 && Date.now() - lastTalk < 22000;
      if (!woke && !follow) return "";
      const cleaned = text.replace(WAKE, " ").replace(/\s+/g, " ").trim();
      if (woke && !cleaned) return "hola";
      return cleaned || text;
    }

    let lastSttErr = 0;

    async function transcribe(blob, { quiet = false } = {}) {
      if (!blob || blob.size < 1200) return "";
      const fd = new FormData();
      fd.append("file", blob, mime.includes("mp4") ? "audio.mp4" : "audio.webm");
      try {
        const res = await fetch("/api/stt", { method: "POST", body: fd });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          if (!quiet || Date.now() - lastSttErr > 12000) {
            lastSttErr = Date.now();
            const msg = typeof data.detail === "string" ? data.detail : "No pude transcribir.";
            add("jarvis", msg);
          }
          return "";
        }
        return (data.text || "").trim();
      } catch (err) {
        if (!quiet || Date.now() - lastSttErr > 12000) {
          lastSttErr = Date.now();
          add("jarvis", "No pude transcribir: falló la red local.");
        }
        return "";
      }
    }

    async function recordUtterance(maxMs) {
      chunks = [];
      recorder = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
      recorder.ondataavailable = (ev) => { if (ev.data && ev.data.size) chunks.push(ev.data); };
      recorder.start(200);
      mic.classList.add("hot");
      setLive(handsFree ? "escuchando — decí Ilaria" : "escuchando", true);
      setOrb("listening");
      const started = Date.now();
      let heard = false;
      let quiet = 0;
      while (Date.now() - started < maxMs) {
        await sleep(80);
        const level = rms();
        orb.style.setProperty("--voice", Math.min(1, level / 0.12).toFixed(3));
        if (waveform) {
          const bars = waveform.querySelectorAll(".wave-bar");
          const v = Math.min(1, level / 0.1);
          bars.forEach((bar, i) => {
            bar.style.height = (8 + v * (18 + (i % 3) * 10)).toFixed(1) + "px";
          });
        }
        if (level > 0.035) {
          heard = true;
          quiet = 0;
        } else if (heard) {
          quiet += 80;
          if (quiet >= 900) break;
        } else if (Date.now() - started > 4500) {
          break;
        }
      }
      await new Promise((resolve) => {
        recorder.onstop = resolve;
        try { recorder.stop(); } catch (e) { resolve(); }
      });
      mic.classList.remove("hot");
      return new Blob(chunks, { type: recorder.mimeType || mime || "audio/webm" });
    }

    async function send(text) {
      if (!text.trim() || busy) return;
      busy = true;
      add("user", text);
      q.value = "";
      setLive("pensando…", true);
      setOrb("thinking");
      const el = document.createElement("div");
      el.className = "msg jarvis";
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
      const t0 = performance.now();
      try {
        const res = await fetch("/api/chat/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, speak: true }),
        });
        if (!res.ok || !res.body) {
          let detail = "No pude responder.";
          try {
            const data = await res.json();
            detail = data.detail || data.error || detail;
          } catch (e) {}
          el.textContent = detail;
          showCaption(detail, "jarvis");
          return;
        }
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buf = "";
        let audioUrl = "";
        let finalReply = "";
        let earlyPlaying = false;
        let skipFull = false;
        let latencyMs = 0;
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          const blocks = buf.split("\n\n");
          buf = blocks.pop() || "";
          for (let i = 0; i < blocks.length; i++) {
            const block = blocks[i].trim();
            if (!block) continue;
            let eventName = "message";
            const dataLines = [];
            block.split("\n").forEach((line) => {
              if (line.startsWith("event:")) eventName = line.slice(6).trim();
              if (line.startsWith("data:")) dataLines.push(line.slice(5).trim());
            });
            if (!dataLines.length) continue;
            let data = {};
            try { data = JSON.parse(dataLines.join("\n")); } catch (e) { continue; }
            if (eventName === "token" && data.text) {
              el.textContent += data.text;
              showCaption(el.textContent, "jarvis");
              log.scrollTop = log.scrollHeight;
            }
            if (eventName === "early_audio" && data.audio_url && !earlyPlaying) {
              earlyPlaying = true;
              setLive("hablando…", true);
              playAudioUrl(data.audio_url, data.text || "").catch(() => {});
            }
            if (eventName === "error") {
              el.textContent = data.detail || "Error en el stream.";
              showCaption(el.textContent, "jarvis");
            }
            if (eventName === "done") {
              finalReply = data.reply || el.textContent;
              el.textContent = finalReply;
              audioUrl = data.audio_url || "";
              skipFull = !!data.skip_full_tts;
              latencyMs = Number(data.latency_ms) || Math.round(performance.now() - t0);
              showCaption(finalReply, "jarvis");
            }
          }
        }
        const latEl = document.getElementById("metric-lat");
        if (latEl && latencyMs) latEl.textContent = latencyMs + " ms";
        if (audioUrl && (!earlyPlaying || !skipFull)) {
          if (earlyPlaying && !skipFull) stopVoice();
          setLive("hablando…", true);
          await playAudioUrl(audioUrl, finalReply || el.textContent);
        } else if (!audioUrl && !earlyPlaying) {
          setLive("hablando…", true);
          await playAudioUrl("", finalReply || el.textContent);
        } else {
          setLive(handsFree ? "escuchando — decí Ilaria" : "En línea", handsFree);
        }
      } finally {
        busy = false;
        setLive(handsFree ? "escuchando — decí Ilaria" : "En línea", handsFree);
      }
    }

    async function talkOnce() {
      if (busy || speaking || pushTalk) return;
      pushTalk = true;
      try {
        await ensureMic();
      } catch (err) {
        add("jarvis", "Micrófono bloqueado. Permitilo o abrí http://localhost:8787 en Edge/Chrome.");
        pushTalk = false;
        return;
      }
      const blob = await recordUtterance(18000);
      setLive("procesando voz…", true);
      setOrb("thinking");
      const text = await transcribe(blob);
      pushTalk = false;
      if (text) await send(text);
      else setLive(handsFree ? "escuchando — decí Ilaria" : "En línea", handsFree);
    }

    async function handsLoop() {
      setLive("escuchando — decí Ilaria", true);
      setOrb("listening");
      try {
        await ensureMic();
      } catch (err) {
        handsFree = false;
        freeBtn.classList.remove("hot");
        add("jarvis", "Micrófono bloqueado.");
        setLive("En línea");
        return;
      }
      while (handsFree) {
        if (busy || pushTalk) {
          await sleep(200);
          continue;
        }
        let startRec = false;
        let voiced = 0;
        const waitStart = Date.now();
        while (handsFree && !busy && !pushTalk && Date.now() - waitStart < 120000) {
          await sleep(60);
          if (speaking && rms() > 0.09) {
            try { voiceEl.pause(); voiceEl.currentTime = 0; } catch (e) {}
            speaking = false;
            setLive("te escucho — corté la voz", true);
            setOrb("listening");
          }
          if (speaking) continue;
          if (rms() > 0.055) {
            voiced += 60;
            if (voiced >= 180) {
              startRec = true;
              break;
            }
          } else {
            voiced = 0;
          }
        }
        if (!handsFree || busy || speaking || !startRec) continue;
        const blob = await recordUtterance(14000);
        if (!handsFree || busy || speaking) continue;
        if (!blob || blob.size < 1800) {
          if (handsFree) setLive("escuchando — decí Ilaria", true);
          await sleep(400);
          continue;
        }
        setLive("procesando voz…", true);
        setOrb("thinking");
        const text = await transcribe(blob, { quiet: true });
        const gated = fromHandsFree(text);
        if (handsFree && gated) await send(gated);
        else if (handsFree) {
          setLive("escuchando — decí Ilaria", true);
          await sleep(700);
        }
      }
      setLive("En línea");
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      send(q.value);
    });

    if (!canRecord) {
      mic.hidden = true;
      freeBtn.hidden = true;
    }

    mic.addEventListener("click", () => {
      if (busy) return;
      talkOnce();
    });

    freeBtn.addEventListener("click", () => {
      handsFree = !handsFree;
      freeBtn.classList.toggle("hot", handsFree);
      freeBtn.textContent = handsFree ? "Oír" : "Mute";
      if (handsFree) {
        handsLoop();
      } else {
        setLive("En línea");
        setOrb("");
      }
    });

    (async () => {
      const me = await fetch("/api/me");
      if (!me.ok) { location.href = "/welcome"; return; }
      const data = await me.json();
      if (data.token) sessionToken = data.token;
      const name = (data.user && data.user.display_name) || "";
      const assistant = (data.status && data.status.name) || "Ilaria";
      document.title = assistant;
      document.getElementById("brand").textContent = assistant.toUpperCase();
      if (data.user && data.user.is_owner) {
        document.getElementById("adminLink").hidden = false;
      }
      let greeted = false;
      try {
        const welcome = await fetch("/api/welcome-report");
        if (welcome.ok) {
          const report = await welcome.json();
          const line = report.voice_text || report.ui_display;
          if (line) {
            add("jarvis", line);
            setLive("hablando…", true);
            await playAudioUrl(report.audio_url, line);
            greeted = true;
          }
          const packEl = document.getElementById("metric-pack");
          const nextEl = document.getElementById("metric-next");
          const actEl = document.getElementById("metric-action");
          const contEl = document.getElementById("metric-continue");
          if (packEl) packEl.textContent = report.pack || "—";
          if (nextEl) nextEl.textContent = report.next_reminder || "sin timers";
          if (actEl) actEl.textContent = report.last_action || "—";
          if (contEl) contEl.textContent = report.continue_hint || "—";
          if (report.continue_hint) {
            add("jarvis", "Continuidad: «" + report.continue_hint + "». Decí deshacer si la última acción fue un error.");
          }
        }
      } catch (e) {}
      if (!greeted) {
        add("jarvis", name ? "Hola " + name + ", ya estoy acá." : "Hola… ya estoy acá.");
      }
      if (!data.has_llm) {
        add("jarvis", "Sin Ollama ni key. Clima, notas y búsqueda andan; para charla completa levantá gemma2:2b o pegá Groq en Perfil.");
      }
      if (canRecord) {
        handsFree = true;
        freeBtn.classList.add("hot");
        freeBtn.textContent = "Oír";
        setLive("escuchando — decí Ilaria", true);
        handsLoop();
      } else {
        setLive("En línea");
      }
    })();

    document.getElementById("out").onclick = async () => {
      await fetch("/api/logout", { method: "POST" });
      location.href = "/welcome";
    };

    let alertAfter = 0;
    async function pollAlerts() {
      try {
        const res = await fetch("/api/alerts?after=" + alertAfter);
        const data = await res.json();
        for (const item of data.items || []) {
          alertAfter = Math.max(alertAfter, item.id);
          add("jarvis", item.text);
          setLive("aviso", true);
          if (item.audio_url) await playAudioUrl(item.audio_url, item.text);
          else await speak(item.text);
        }
      } catch (e) {}
    }
    setInterval(pollAlerts, 4000);

    async function refreshMetrics() {
      const ollamaEl = document.getElementById("metric-ollama");
      const ttsEl = document.getElementById("metric-tts");
      const portEl = document.getElementById("metric-port");
      const verEl = document.getElementById("metric-version");
      try {
        const h = await fetch("/health").then((r) => r.json());
        if (portEl) portEl.textContent = "Activo";
        if (ttsEl) ttsEl.textContent = (h.tts || "local").toUpperCase();
        if (verEl) verEl.textContent = "v" + (h.version || "?");
      } catch (e) {
        if (portEl) portEl.textContent = "Caído";
      }
      try {
        const me = await fetch("/api/me").then((r) => r.json());
        if (ollamaEl) {
          ollamaEl.textContent = me.has_llm ? "OK" : "OFF";
          ollamaEl.className = me.has_llm ? "text-green" : "text-warn";
        }
      } catch (e) {}
      try {
        const meta = await fetch("/api/meta").then((r) => r.json());
        const andEl = document.getElementById("metric-android");
        if (andEl) andEl.textContent = meta.min_required_android_client
          ? ("min " + meta.min_required_android_client)
          : "—";
      } catch (e) {}
      try {
        const mission = await fetch("/api/mission").then((r) => r.json());
        const packEl = document.getElementById("metric-pack");
        const nextEl = document.getElementById("metric-next");
        const actEl = document.getElementById("metric-action");
        const contEl = document.getElementById("metric-continue");
        if (packEl) packEl.textContent = mission.pack || "—";
        if (nextEl) nextEl.textContent = mission.next_reminder || "sin timers";
        if (actEl) actEl.textContent = mission.last_action || "—";
        if (contEl) contEl.textContent = mission.continue_hint || "—";
      } catch (e) {}
    }
    refreshMetrics();
    setInterval(refreshMetrics, 12000);
  </script>
</body>
